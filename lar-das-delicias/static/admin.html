<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração | Lar das Delícias</title><link rel="stylesheet" href="/static/style.css"></head><body><div id="loginScreen" class="login"><a href="/" class="brand">Lar das Delícias</a><h2>Painel administrativo</h2><p class="muted">Acesso exclusivo da proprietária.</p><form id="loginForm"><label class="field">E-mail<input name="email" class="input" type="email" required autocomplete="username"></label><label class="field">Senha<input name="password" class="input" type="password" required autocomplete="current-password"></label><button class="btn" type="submit" style="width:100%">Entrar</button></form></div>
